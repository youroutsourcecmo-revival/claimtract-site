name: Roadmap self-update
on:
  push:
    branches: [landing]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/roadmap_check.py
      - run: |
          if ! git diff --quiet assets/roadmap.json; then
            git config user.name "roadmap-bot"
            git config user.email "roadmap-bot@users.noreply.github.com"
            git add assets/roadmap.json
            git commit -m "Roadmap: statuses updated automatically"
            git push
          fi
