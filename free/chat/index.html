<!doctype html><html lang="en"><head>
<script src="/assets/ct-one.js?v=2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light"><title>Live chat</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#go{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:transparent;color:#14161A;border:0;width:100%;cursor:pointer;z-index:2147483647;font:inherit}
#go b{font:800 20px/1.2 Inter,sans-serif;max-width:260px;text-align:center}#go small{color:#555B66;font-size:13px}
#go i{width:74px;height:74px;border-radius:50%;background:#F5A524;display:grid;place-items:center;font-style:normal;font-size:30px;color:#111;box-shadow:0 0 0 0 rgba(245,165,36,.7);animation:p 1.8s ease-out infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(245,165,36,.7)}70%{box-shadow:0 0 0 18px rgba(245,165,36,0)}100%{box-shadow:0 0 0 0 rgba(245,165,36,0)}}</style></head><body>
<button id="go" type="button" aria-label="Start the live chat"><i>&#128172;</i><b id="gt">Tap to talk to the live chat assistant</b><small>He answers right here. Ask him anything.</small></button>
<script src="https://humanchat.net/build/js/hb_latest.js?v=1.5.28" crossorigin="anonymous"></script>
<script>
var q=new URLSearchParams(location.search),id=(q.get('id')||'sJrT98BRSJTp').replace(/[^A-Za-z0-9]/g,'');if(q.get('t'))document.getElementById('gt').textContent=q.get('t').slice(0,80);
try{new AiBot({embedId:id,remoteBaseUrl:'https://humanchat.net/',version:'1.5.28'})}catch(e){}
document.getElementById('go').onclick=function(){var b=this,l=document.querySelector('.cp-chat-avatar-logo')||document.querySelector('.cp-chat-avatar-container');if(l)l.click();b.remove()};
</script></body></html>
