function chime(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();if(AC.state!=='running')return false;
 var t=AC.currentTime+.05,out=AC.createDynamicsCompressor();out.connect(AC.destination);var m=AC.createGain();m.gain.value=.55;m.connect(out);
 var len=AC.sampleRate*2,nb=AC.createBuffer(1,len,AC.sampleRate),d=nb.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
 var ns=AC.createBufferSource();ns.buffer=nb;var bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.4;bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(4200,t+1.7);
 var ng=AC.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.22,t+1.5);ng.gain.exponentialRampToValueAtTime(.001,t+2);ns.connect(bp);bp.connect(ng);ng.connect(m);ns.start(t);ns.stop(t+2);
 var b=AC.createOscillator(),bg=AC.createGain();b.type='sine';b.frequency.setValueAtTime(70,t+1.75);b.frequency.exponentialRampToValueAtTime(38,t+3.2);bg.gain.setValueAtTime(0,t+1.74);bg.gain.linearRampToValueAtTime(.7,t+1.78);bg.gain.exponentialRampToValueAtTime(.001,t+3.4);b.connect(bg);bg.connect(m);b.start(t+1.7);b.stop(t+3.5);
 [[880,.18],[1318.5,.13],[1760,.1],[2637,.06]].forEach(function(f,k){var o=AC.createOscillator(),g=AC.createGain();o.type=k?'sine':'triangle';o.frequency.value=f[0];o.detune.value=(k%2?4:-4);var st=t+1.8+k*.035;g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(f[1],st+.02);g.gain.exponentialRampToValueAtTime(.0008,st+2.6);o.connect(g);g.connect(m);o.start(st);o.stop(st+2.7)});
 return true}catch(e){return false}}
